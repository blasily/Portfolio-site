<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Portfolio</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container">

      <header>
        <h1>Hey, I'm <span class="name">Blasily</span></h1>
        <p class="bio">Music composer & Sound designer! I make music for games ^^</p>
      </header>

      <section class="tracks">
        <h2>Stuff I made recently</h2>

        <div class="track-row">
          <div class="track-info">
            <h3>Boss Battle Loop</h3>
            <p>Heavy guitars and driving percussion. Seamless combat loop.</p>
          </div>
          <!-- Clean native audio player -->
          <div class="audio-container">
            <audio controls src="audio/boss-battle.mp3"></audio>
          </div>
        </div>

        <div class="track-row">
          <div class="track-info">
            <h3>Deep Cave Ambience</h3>
            <p>Dark atmospheric pads for underground exploration.</p>
          </div>
          <!-- Clean native audio player -->
          <div class="audio-container">
            <audio controls src="audio/cave-ambience.mp3"></audio>
          </div>
        </div>
      </section>

      <footer>
        <h2>Contact</h2>
        <div class="links">
          <a href="https://discord.gg/5BvVWpfBSv" target="_blank" rel="noopener noreferrer">Discord: blasily</a>
        </div>
      </footer>

    </main>
  </body>
</html>
